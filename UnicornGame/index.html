<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Einhorn-Wiese 3D</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #d4e6f2;
    font-family: "Trebuchet MS", Arial, sans-serif; touch-action: none;
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #hud { position: absolute; top: 12px; left: 12px; padding: 10px 14px; border-radius: 12px;
    background: rgba(255,255,255,.8); color: #8a3d78; font-weight: bold; font-size: 14px; line-height: 1.5;
    pointer-events: none; }
  #score { position: absolute; top: 12px; right: 12px; padding: 8px 16px; border-radius: 14px;
    background: rgba(255,255,255,.85); color: #c48a00; font-weight: bold; font-size: 26px; pointer-events: none;
    transition: transform .15s; }
  #score.pop { transform: scale(1.25); }
  #win { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); display: none;
    padding: 24px 40px; border-radius: 20px; background: rgba(255,255,255,.92); color: #b0408f;
    text-align: center; font-size: 40px; font-weight: bold; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #win small { display: block; font-size: 17px; color: #8a3d78; margin-top: 8px; }
  #touch { position: absolute; right: 16px; bottom: 16px; display: none; gap: 12px; }
  #touch button { width: 76px; height: 76px; border-radius: 50%; border: 3px solid #fff;
    background: rgba(255,105,180,.55); color: #fff; font-size: 26px; font-weight: bold; }
  #touch button.on { background: rgba(160,60,220,.8); }
  #stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.8); background: rgba(255,255,255,.2); display: none; pointer-events: none; }
  #stick div { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,105,180,.8); }
</style>
</head>
<body>
<div id="hud">
  W A S D / Pfeile: laufen &nbsp;·&nbsp; Shift: rennen &nbsp;·&nbsp; Leertaste: springen<br>
  Maus ziehen: Kamera drehen &nbsp;·&nbsp; Mausrad: Zoom &nbsp;·&nbsp; E: umschauen<br>
  Sammle alle Sterne! Manche liegen hoch – da musst du springen.
</div>
<div id="score">⭐ 0 / 0</div>
<div id="win"><div>🌈 Geschafft! 🌈</div><small>Alle Sterne gesammelt.<br>Drücke R (oder tippe hier) für eine neue Runde.</small></div>
<div id="stick"><div></div></div>
<div id="touch"><button id="bLook">👀</button><button id="bRun">⚡</button><button id="bJump">⤒</button></div>

<!-- Three.js liegt lokal im Ordner lib/, damit das Spiel auch ohne Internet läuft -->
<script src="lib/three.min.js"></script>
<!-- Das Spiel ist auf mehrere Dateien aufgeteilt (Reihenfolge ist wichtig): -->
<script src="js/world.js"></script>    <!-- Himmel, Wiese, Hindernisse -->
<script src="js/unicorn.js"></script>  <!-- das Einhorn -->
<script src="js/stars.js"></script>    <!-- Sterne zum Sammeln -->
<script src="js/game.js"></script>     <!-- Steuerung, Physik, Kamera -->
</body>
</html>
