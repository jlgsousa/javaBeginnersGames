<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Einhorn-Wiese 3D</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #9fd6ff;
    font-family: "Trebuchet MS", Arial, sans-serif; touch-action: none;
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #hud { position: absolute; top: 12px; left: 12px; padding: 10px 14px; border-radius: 12px;
    background: rgba(255,255,255,.8); color: #8a3d78; font-weight: bold; font-size: 14px; line-height: 1.5;
    pointer-events: none; }
  #touch { position: absolute; right: 16px; bottom: 16px; display: none; gap: 12px; }
  #touch button { width: 76px; height: 76px; border-radius: 50%; border: 3px solid #fff;
    background: rgba(255,105,180,.55); color: #fff; font-size: 26px; font-weight: bold; }
  #touch button.on { background: rgba(160,60,220,.8); }
  #stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.8); background: rgba(255,255,255,.2); display: none; pointer-events: none; }
  #stick div { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,105,180,.8); }
</style>
</head>
<body>
<div id="hud">
  W A S D / Pfeile: laufen &nbsp;·&nbsp; Shift: rennen &nbsp;·&nbsp; Leertaste: springen<br>
  Maus ziehen: Kamera drehen &nbsp;·&nbsp; Mausrad: Zoom &nbsp;·&nbsp; E: umschauen
</div>
<div id="stick"><div></div></div>
<div id="touch"><button id="bLook">👀</button><button id="bRun">⚡</button><button id="bJump">⤒</button></div>

<!-- Three.js liegt lokal im Ordner lib/, damit das Spiel auch ohne Internet läuft -->
<script src="lib/three.min.js"></script>
<script>
// =====================================================================
//  Einhorn-Wiese 3D – Third-Person, HTML5 + Three.js (WebGL)
//  Einfach index.html im Browser öffnen.
// =====================================================================

// ---------------- Grundgerüst: Renderer, Szene, Kamera ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd6ff);
scene.fog = new THREE.Fog(0x9fd6ff, 30, 70);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Licht
scene.add(new THREE.HemisphereLight(0xdff3ff, 0x5a9a40, 0.75));
const sun = new THREE.DirectionalLight(0xfff2d6, 0.9);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
scene.add(sun, sun.target);

// Hilfsfunktion für Materialien
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...extra });
function mesh(geo, material, shadow = true) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = shadow; m.receiveShadow = true;
  return m;
}

// ---------------- Die Wiese ----------------
const WORLD_R = 30;   // Radius der begehbaren Wiese

const ground = mesh(new THREE.CircleGeometry(80, 64), mat(0x6cc957), false);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const meadow = mesh(new THREE.CircleGeometry(WORLD_R + 1, 64), mat(0x7ed865), false);
meadow.rotation.x = -Math.PI / 2; meadow.position.y = 0.01;
scene.add(meadow);

// Grasbüschel & Blumen (Instancing = sehr leichtgewichtig)
const dummy = new THREE.Object3D();
function scatter(geo, material, count, minR, maxR, setup) {
  const inst = new THREE.InstancedMesh(geo, material, count);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, r = minR + Math.sqrt(Math.random()) * (maxR - minR);
    dummy.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    dummy.rotation.set(0, Math.random() * Math.PI, 0);
    dummy.scale.setScalar(1);
    setup && setup(dummy);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  }
  scene.add(inst);
  return inst;
}
scatter(new THREE.ConeGeometry(0.08, 0.35, 4), mat(0x4fae43), 1800, 0, WORLD_R + 6,
  d => { d.position.y = 0.17; d.scale.y = 0.6 + Math.random() * 0.8; });
[0xff6fb5, 0xffffff, 0xffe11f, 0xb57bff, 0xff8a3d].forEach(c =>
  scatter(new THREE.SphereGeometry(0.09, 6, 4), mat(c), 70, 0, WORLD_R,
    d => { d.position.y = 0.2; }));

// Hindernisse – "circle" = rund, "box" = eckig. h = Höhe (darauf kann man stehen).
const obstacles = [];
function addObstacle(o, object) {
  object.position.x = o.x; object.position.z = o.z;
  scene.add(object);
  obstacles.push(o);
}
function rock(x, z, r, h) {
  const g = new THREE.Group();
  const m = mesh(new THREE.DodecahedronGeometry(1, 0), mat(0x9a9aa8, { flatShading: true }));
  m.scale.set(r, h, r * 0.9); g.add(m);
  addObstacle({ shape: "circle", x, z, r: r * 0.95, h }, g);
}
function log(x, z, len, alongX) {
  const g = new THREE.Group();
  const m = mesh(new THREE.CylinderGeometry(0.35, 0.35, len, 12), mat(0x8b5a33));
  m.rotation.z = Math.PI / 2; m.position.y = 0.35; g.add(m);
  const ring = mat(0xd9a86c);
  [-1, 1].forEach(s => {
    const c = mesh(new THREE.CircleGeometry(0.33, 12), ring);
    c.rotation.y = s * Math.PI / 2; c.position.set(s * (len / 2 + 0.01), 0.35, 0); g.add(c);
  });
  if (!alongX) g.rotation.y = Math.PI / 2;
  addObstacle({ shape: "box", x, z, hw: alongX ? len / 2 : 0.35, hd: alongX ? 0.35 : len / 2, h: 0.7 }, g);
}
function bush(x, z) {
  const g = new THREE.Group(), leaf = mat(0x3d9a47);
  [[0, 0.5, 0, 0.6], [0.45, 0.4, 0.1, 0.45], [-0.4, 0.4, -0.1, 0.45], [0, 0.45, 0.4, 0.4]].forEach(([a, b, c, r]) => {
    const s = mesh(new THREE.SphereGeometry(r, 10, 8), leaf); s.position.set(a, b, c); g.add(s);
  });
  const berry = mat(0xff4d6d);
  for (let i = 0; i < 8; i++) {
    const s = mesh(new THREE.SphereGeometry(0.06, 6, 4), berry, false);
    const a = Math.random() * Math.PI * 2; s.position.set(Math.cos(a) * 0.62, 0.35 + Math.random() * 0.5, Math.sin(a) * 0.62); g.add(s);
  }
  addObstacle({ shape: "circle", x, z, r: 0.85, h: 1.0 }, g);
}
function hay(x, z) {
  const g = new THREE.Group();
  const m = mesh(new THREE.CylinderGeometry(0.75, 0.75, 1.3, 16), mat(0xe8c35a)); m.position.y = 0.65; g.add(m);
  [0.35, 0.95].forEach(y => { const b = mesh(new THREE.TorusGeometry(0.76, 0.04, 6, 24), mat(0xb5462e), false); b.rotation.x = Math.PI / 2; b.position.y = y; g.add(b); });
  addObstacle({ shape: "circle", x, z, r: 0.75, h: 1.3 }, g);
}
function stump(x, z) {
  const g = new THREE.Group();
  const m = mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.6, 12), mat(0x7a4e2c)); m.position.y = 0.3; g.add(m);
  const top = mesh(new THREE.CircleGeometry(0.45, 12), mat(0xd9a86c), false); top.rotation.x = -Math.PI / 2; top.position.y = 0.605; g.add(top);
  const cap = mesh(new THREE.SphereGeometry(0.18, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xe85d75));
  cap.position.set(0.7, 0.18, 0.2); g.add(cap);
  addObstacle({ shape: "circle", x, z, r: 0.55, h: 0.6 }, g);
}
function fence(x, z, len, alongX) {
  const g = new THREE.Group(), wood = mat(0xfff4e3);
  const n = Math.round(len / 0.8);
  for (let i = 0; i <= n; i++) {
    const p = mesh(new THREE.BoxGeometry(0.14, 0.95, 0.14), wood); p.position.set(-len / 2 + i * len / n, 0.47, 0); g.add(p);
  }
  [0.35, 0.75].forEach(y => { const r = mesh(new THREE.BoxGeometry(len, 0.12, 0.06), wood); r.position.y = y; g.add(r); });
  if (!alongX) g.rotation.y = Math.PI / 2;
  addObstacle({ shape: "box", x, z, hw: alongX ? len / 2 : 0.12, hd: alongX ? 0.12 : len / 2, h: 0.95 }, g);
}
function tree(x, z, s = 1) {
  const g = new THREE.Group();
  const trunk = mesh(new THREE.CylinderGeometry(0.25 * s, 0.35 * s, 2.2 * s, 8), mat(0x8a5a3c)); trunk.position.y = 1.1 * s; g.add(trunk);
  const leaf = mat(0x4fae55, { flatShading: true });
  [[0, 3, 0, 1.4], [0.8, 2.5, 0.3, 1], [-0.7, 2.6, -0.3, 1.05]].forEach(([a, b, c, r]) => {
    const l = mesh(new THREE.IcosahedronGeometry(r * s, 0), leaf); l.position.set(a * s, b * s, c * s); g.add(l);
  });
  addObstacle({ shape: "circle", x, z, r: 0.4 * s, h: 99 }, g);   // zu hoch zum Drüberspringen
}

// Testparcours rund um den Startpunkt
rock(4, 3, 0.6, 0.45);
log(-4, 4, 3, true);
bush(6, -3);
hay(-6, -4);
stump(1, 8);
fence(0, -7, 5, true);
rock(-9, 3, 0.9, 0.8);
log(9, 5, 2.5, false);
stump(-2, -11);
hay(10, -8);
// Bäume am Rand der Wiese
for (let i = 0; i < 22; i++) {
  const a = i / 22 * Math.PI * 2 + Math.random() * 0.1;
  const r = WORLD_R + 1.5 + Math.random() * 2;
  tree(Math.cos(a) * r, Math.sin(a) * r, 0.9 + Math.random() * 0.5);
}
// ein paar Bäume weiter innen
tree(13, 12, 1.1); tree(-14, -10, 1); tree(-12, 14, 1.2);

// Wolken
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const clouds = [];
for (let i = 0; i < 9; i++) {
  const c = new THREE.Group();
  for (let k = 0; k < 4; k++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(1.4 + Math.random(), 8, 6), cloudMat);
    s.position.set(k * 1.6 - 2.4, Math.random() * 0.6, Math.random() * 0.8); c.add(s);
  }
  const a = Math.random() * Math.PI * 2, r = 25 + Math.random() * 25;
  c.position.set(Math.cos(a) * r, 16 + Math.random() * 8, Math.sin(a) * r);
  scene.add(c); clouds.push(c);
}

// Regenbogen am Himmel
const RAINBOW = [0xff3b3b, 0xff9a1f, 0xffe11f, 0x3ddc5a, 0x2fa8ff, 0x8a4dff, 0xff4fd8];
RAINBOW.slice(0, 6).forEach((c, i) => {
  const arc = new THREE.Mesh(new THREE.TorusGeometry(26 - i * 0.9, 0.45, 6, 48, Math.PI),
    new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.55, fog: false }));
  arc.position.set(0, 0, -55);
  scene.add(arc);
});

// ---------------- Das Einhorn (aus einfachen Formen gebaut) ----------------
const PINK = 0xff8fcf, PINK_DARK = 0xe26aae, PINK_LIGHT = 0xffc2e6;
const mPink = mat(PINK), mPinkLight = mat(PINK_LIGHT), mHoof = mat(0xb07ad6);
const mGold = mat(0xffd34d, { metalness: 0.4, roughness: 0.35, emissive: 0x553300 });

const uni = {
  root: new THREE.Group(),   // Position & Drehung in der Welt
  body: new THREE.Group(),   // für Wippen / Neigen
  pos: new THREE.Vector3(0, 0, 0),
  vel: new THREE.Vector3(),
  heading: 0, onGround: true, jumpHeld: false,
  phase: 0, runBlend: 0, airBlend: 0, squash: 0,
  legs: [], mane: [], tail: [],
  headPivot: null, eyes: [],
  look: { yaw: 0, pitch: 0, ty: 0, tp: 0, timer: 2, idle: 0, held: false },
  blink: 2,
};
uni.root.add(uni.body);
scene.add(uni.root);

// Körper
const torso = mesh(new THREE.SphereGeometry(1, 20, 14), mPink);
torso.scale.set(0.55, 0.5, 0.95); torso.position.y = 1.3;
uni.body.add(torso);
const belly = mesh(new THREE.SphereGeometry(1, 16, 10), mPinkLight);
belly.scale.set(0.45, 0.32, 0.75); belly.position.set(0, 1.1, 0.05);
uni.body.add(belly);

// Beine: Hüfte → Oberschenkel → Knie → Unterschenkel → Huf
function makeLeg(x, z, front) {
  const hip = new THREE.Group(); hip.position.set(x, 1.1, z);
  const upper = mesh(new THREE.CapsuleGeometry(0.13, 0.4, 4, 8), mPink); upper.position.y = -0.27; hip.add(upper);
  const knee = new THREE.Group(); knee.position.y = -0.55; hip.add(knee);
  const lower = mesh(new THREE.CapsuleGeometry(0.11, 0.35, 4, 8), mPink); lower.position.y = -0.24; knee.add(lower);
  const hoof = mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.12, 10), mHoof); hoof.position.y = -0.5; knee.add(hoof);
  uni.body.add(hip);
  return { hip, knee, front, side: x };
}
uni.legs = [
  makeLeg(-0.3, -0.55, false), makeLeg(0.3, -0.55, false),
  makeLeg(-0.3, 0.6, true), makeLeg(0.3, 0.6, true),
];

// Hals + Kopf hängen an einem Drehpunkt → so kann sich das Einhorn umschauen
const headPivot = new THREE.Group(); headPivot.position.set(0, 1.55, 0.7);
uni.body.add(headPivot); uni.headPivot = headPivot;
const neck = mesh(new THREE.CapsuleGeometry(0.24, 0.6, 4, 10), mPink);
neck.position.set(0, 0.35, 0.15); neck.rotation.x = 0.55; headPivot.add(neck);
const head = new THREE.Group(); head.position.set(0, 0.8, 0.4); headPivot.add(head);
const skull = mesh(new THREE.SphereGeometry(1, 16, 12), mPink); skull.scale.set(0.3, 0.3, 0.38); head.add(skull);
const snout = mesh(new THREE.SphereGeometry(1, 14, 10), mPinkLight); snout.scale.set(0.24, 0.22, 0.25); snout.position.set(0, -0.08, 0.33); head.add(snout);
[-1, 1].forEach(s => {
  const nostril = mesh(new THREE.SphereGeometry(0.03, 6, 4), mat(PINK_DARK), false); nostril.position.set(s * 0.09, -0.02, 0.56); head.add(nostril);
  // Augen
  const eye = new THREE.Group(); eye.position.set(s * 0.22, 0.07, 0.18); head.add(eye);
  const white = mesh(new THREE.SphereGeometry(0.085, 10, 8), mat(0xffffff), false); eye.add(white);
  const pupil = mesh(new THREE.SphereGeometry(0.06, 10, 8), mat(0x2a1530), false); pupil.position.set(s * 0.04, 0.0, 0.035); eye.add(pupil);
  const shine = mesh(new THREE.SphereGeometry(0.018, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }), false);
  shine.position.set(s * 0.08, 0.03, 0.06); eye.add(shine);
  uni.eyes.push(eye);
  // Ohren
  const ear = mesh(new THREE.ConeGeometry(0.08, 0.25, 6), mPink); ear.position.set(s * 0.15, 0.3, -0.1); ear.rotation.z = -s * 0.3; head.add(ear);
  // Bäckchen
  const cheek = mesh(new THREE.SphereGeometry(0.05, 8, 6), mat(0xff5fa0, { transparent: true, opacity: 0.6 }), false);
  cheek.position.set(s * 0.25, -0.06, 0.15); head.add(cheek);
});
// Horn
const horn = mesh(new THREE.ConeGeometry(0.08, 0.6, 12), mGold);
horn.position.set(0, 0.42, 0.12); horn.rotation.x = 0.4; head.add(horn);
for (let i = 0; i < 3; i++) {   // Spiralringe
  const ring = mesh(new THREE.TorusGeometry(0.065 - i * 0.017, 0.012, 4, 12), mGold, false);
  ring.position.set(0, -0.15 + i * 0.13, 0); ring.rotation.x = Math.PI / 2 + 0.3; horn.add(ring);
}

// Mähne: bunte Strähnen entlang des Halses
const rainbowMats = RAINBOW.map(c => mat(c));
for (let i = 0; i < 10; i++) {
  const f = i / 9;
  const pivot = new THREE.Group();
  pivot.position.set(0, 1.0 - f * 0.95, 0.22 - f * 0.57);
  const strand = mesh(new THREE.CapsuleGeometry(0.07, 0.35, 3, 6), rainbowMats[i % 7]);
  strand.position.y = -0.2;
  pivot.add(strand);
  pivot.userData.base = 0.45;       // hängt nach hinten unten
  pivot.userData.side = (i % 2 ? 1 : -1);
  headPivot.add(pivot);
  uni.mane.push(pivot);
}
// Stirnlocke
[0, 1, 2].forEach(i => {
  const s = mesh(new THREE.CapsuleGeometry(0.05, 0.18, 3, 6), rainbowMats[i * 2]);
  s.position.set((i - 1) * 0.07, 0.3, 0.22); s.rotation.x = 1.0; head.add(s);
});

// Schweif: 7 bunte Strähnen, jede aus 3 Gliedern (biegt sich schön)
const tailRoot = new THREE.Group(); tailRoot.position.set(0, 1.45, -0.9); uni.body.add(tailRoot);
for (let i = 0; i < 7; i++) {
  let parent = tailRoot;
  const chain = [];
  for (let k = 0; k < 3; k++) {
    const seg = new THREE.Group();
    if (k > 0) seg.position.y = -0.32;
    const m = mesh(new THREE.CapsuleGeometry(0.075 - k * 0.012, 0.26, 3, 6), rainbowMats[i]);
    m.position.y = -0.16; seg.add(m);
    parent.add(seg); chain.push(seg); parent = seg;
  }
  chain[0].userData.spread = (i - 3) * 0.12;
  uni.tail.push(chain);
}

// ---------------- Glitzer- & Staubpartikel ----------------
const particles = [];
const sparkGeo = new THREE.OctahedronGeometry(0.08, 0);
function spawnParticle(pos, color, vel, life, size, gravity) {
  const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
  m.position.copy(pos); m.scale.setScalar(size);
  scene.add(m);
  particles.push({ m, vel, life, max: life, gravity });
}

// ---------------- Eingabe ----------------
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

const cam = { yaw: Math.PI, pitch: 0.35, dist: 7, target: new THREE.Vector3(0, 1.5, 0) };

// Maus: ziehen = Kamera drehen, Rad = Zoom
let dragging = false, lastX = 0, lastY = 0;
const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
renderer.domElement.addEventListener("mousedown", e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener("mouseup", () => { dragging = false; });
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  cam.yaw -= (e.clientX - lastX) * 0.006;
  cam.pitch = Math.max(-0.05, Math.min(1.25, cam.pitch + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener("wheel", e => {
  cam.dist = Math.max(3.5, Math.min(14, cam.dist + e.deltaY * 0.01));
  e.preventDefault();
}, { passive: false });

// Touch: links = Joystick, rechts = Kamera drehen
const touch = { x: 0, y: 0, jump: false, run: false, look: false };
if (isTouch) {
  document.getElementById("touch").style.display = "flex";
  const stick = document.getElementById("stick"), knob = stick.firstElementChild;
  let stickId = null, camId = null, sx = 0, sy = 0;
  renderer.domElement.addEventListener("touchstart", e => {
    for (const t of e.changedTouches) {
      if (t.clientX < window.innerWidth / 2 && stickId === null) {
        stickId = t.identifier; sx = t.clientX; sy = t.clientY;
        stick.style.left = sx + "px"; stick.style.top = sy + "px"; stick.style.display = "block";
      } else if (camId === null) { camId = t.identifier; lastX = t.clientX; lastY = t.clientY; }
    }
    e.preventDefault();
  }, { passive: false });
  renderer.domElement.addEventListener("touchmove", e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        let dx = t.clientX - sx, dy = t.clientY - sy;
        const len = Math.hypot(dx, dy), max = 45;
        if (len > max) { dx *= max / len; dy *= max / len; }
        touch.x = dx / max; touch.y = dy / max;
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
      } else if (t.identifier === camId) {
        cam.yaw -= (t.clientX - lastX) * 0.008;
        cam.pitch = Math.max(-0.05, Math.min(1.25, cam.pitch + (t.clientY - lastY) * 0.006));
        lastX = t.clientX; lastY = t.clientY;
      }
    }
    e.preventDefault();
  }, { passive: false });
  renderer.domElement.addEventListener("touchend", e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) { stickId = null; touch.x = touch.y = 0; stick.style.display = "none"; knob.style.transform = ""; }
      if (t.identifier === camId) camId = null;
    }
  });
  const hold = (id, prop) => {
    const b = document.getElementById(id);
    b.addEventListener("pointerdown", e => { touch[prop] = true; e.preventDefault(); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => touch[prop] = false));
  };
  hold("bJump", "jump"); hold("bLook", "look");
  document.getElementById("bRun").addEventListener("pointerdown", e => {
    touch.run = !touch.run; e.currentTarget.classList.toggle("on", touch.run);
  });
}

const input = {
  get fwd()   { return (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - touch.y; },
  get side()  { return (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + touch.x; },
  get jump()  { return keys.Space || touch.jump; },
  get run()   { return keys.ShiftLeft || keys.ShiftRight || touch.run; },
  get look()  { return keys.KeyE || touch.look; },
};

// ---------------- Physik & Kollision ----------------
const WALK = 3.5, RUN = 9, GRAVITY = 25, JUMP = 9.2, RADIUS = 0.6;

// Wie weit steckt das Einhorn (Kreis) im Hindernis? → Schiebevektor oder null
function penetration(o, x, z) {
  let cx, cz;
  if (o.shape === "circle") { cx = o.x; cz = o.z; }
  else { cx = Math.max(o.x - o.hw, Math.min(o.x + o.hw, x)); cz = Math.max(o.z - o.hd, Math.min(o.z + o.hd, z)); }
  const dx = x - cx, dz = z - cz, d = Math.hypot(dx, dz);
  const need = RADIUS + (o.shape === "circle" ? o.r : 0);
  if (d >= need) return null;
  if (d < 1e-4) return { x: need, z: 0 };
  return { x: dx / d * (need - d), z: dz / d * (need - d) };
}
// höchste Oberfläche unter den Hufen
function supportHeight(p) {
  let s = 0;
  for (const o of obstacles) if (o.h <= p.y + 0.05 && penetration(o, p.x, p.z)) s = Math.max(s, o.h);
  return s;
}
const angleDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

// ---------------- Update ----------------
function update(dt, t) {
  const u = uni;

  // Bewegung relativ zur Kamera
  const f = input.fwd, s = input.side;
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);   // vorwärts (weg von der Kamera)
  const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);    // rechts
  let mx = fx * f + rx * s, mz = fz * f + rz * s;
  const mlen = Math.min(1, Math.hypot(mx, mz));
  const moving = mlen > 0.1;
  const speed = input.run ? RUN : WALK;
  if (moving) {
    const l = Math.hypot(mx, mz); mx /= l; mz /= l;
    const targetHeading = Math.atan2(mx, mz);
    u.heading += angleDiff(u.heading, targetHeading) * Math.min(1, dt * (u.onGround ? 10 : 4));
  }
  // Einhorn läuft immer in Blickrichtung (sieht natürlicher aus)
  const tvx = moving ? Math.sin(u.heading) * speed * mlen : 0;
  const tvz = moving ? Math.cos(u.heading) * speed * mlen : 0;
  const acc = u.onGround ? 8 : 3;
  u.vel.x += (tvx - u.vel.x) * Math.min(1, dt * acc);
  u.vel.z += (tvz - u.vel.z) * Math.min(1, dt * acc);

  // Springen (mit Anlauf höher)
  const hs = Math.hypot(u.vel.x, u.vel.z);
  if (input.jump && u.onGround && !u.jumpHeld) {
    u.vel.y = JUMP + hs * 0.18;
    u.onGround = false;
    for (let i = 0; i < 10; i++) dust();
  }
  u.jumpHeld = input.jump;
  if (!input.jump && u.vel.y > 3) u.vel.y -= GRAVITY * 1.2 * dt;  // kurz drücken = kleiner Sprung

  // horizontal bewegen + aus Hindernissen herausschieben
  u.pos.x += u.vel.x * dt; u.pos.z += u.vel.z * dt;
  for (const o of obstacles) {
    if (u.pos.y >= o.h - 0.05) continue;       // drüber → keine seitliche Kollision
    const p = penetration(o, u.pos.x, u.pos.z);
    if (p) { u.pos.x += p.x; u.pos.z += p.z; }
  }
  // Rand der Wiese
  const r = Math.hypot(u.pos.x, u.pos.z);
  if (r > WORLD_R) { u.pos.x *= WORLD_R / r; u.pos.z *= WORLD_R / r; }

  // vertikal + landen
  const ground = supportHeight(u.pos);
  u.vel.y -= GRAVITY * dt;
  u.pos.y += u.vel.y * dt;
  if (u.pos.y <= ground) {
    if (!u.onGround && u.vel.y < -4) {
      u.squash = Math.min(1, -u.vel.y / 14);
      for (let i = 0; i < 12; i++) dust();
    }
    u.pos.y = ground; u.vel.y = 0; u.onGround = true;
  } else u.onGround = false;

  // --- Animation ---
  const sp = Math.hypot(u.vel.x, u.vel.z);
  const mov = Math.min(1, sp / 0.6);
  if (u.onGround) u.phase += dt * (sp * 2.6 + (sp > 0.2 ? 2 : 0));
  u.runBlend += ((sp > (WALK + RUN) / 2 ? 1 : 0) - u.runBlend) * Math.min(1, dt * 6);
  u.airBlend += ((u.onGround ? 0 : 1) - u.airBlend) * Math.min(1, dt * 12);
  u.squash = Math.max(0, u.squash - dt * 4);

  u.root.position.copy(u.pos);
  u.root.rotation.y = u.heading;

  const bob = u.onGround ? Math.abs(Math.sin(u.phase)) * (0.04 + u.runBlend * 0.1) * mov : 0;
  const breathe = (1 - mov) * Math.sin(t * 2.5) * 0.015;
  u.body.position.y = bob;
  u.body.scale.set(1 + u.squash * 0.12, 1 - u.squash * 0.15 + breathe, 1 + u.squash * 0.06);
  u.body.rotation.x = u.onGround ? u.runBlend * 0.08 * mov : Math.max(-0.35, Math.min(0.35, -u.vel.y * 0.035));

  // Beine: Trab beim Gehen, Galopp beim Rennen
  const rb = u.runBlend;
  const offsets = [0, Math.PI * (1 - rb) + 0.5 * rb, Math.PI * (1 - rb) + (Math.PI + 0.5) * rb, Math.PI];
  // Reihenfolge: hinten links, hinten rechts, vorne links, vorne rechts
  u.legs.forEach((leg, i) => {
    const p = u.phase + [0, offsets[1], offsets[2], offsets[3]][i];
    const amp = 0.5 + rb * 0.45;
    let swing = -Math.sin(p) * amp * mov;
    let bend = Math.max(0, Math.cos(p)) * (0.7 + rb * 0.5) * mov * (leg.front ? 1 : -1);
    const tuckSwing = leg.front ? -0.9 : 0.8, tuckBend = leg.front ? 1.7 : -1.4;
    swing = swing * (1 - u.airBlend) + tuckSwing * u.airBlend;
    bend = bend * (1 - u.airBlend) + tuckBend * u.airBlend;
    leg.hip.rotation.x = swing;
    leg.knee.rotation.x = bend;
  });

  // Mähne & Schweif wehen (mehr Wind beim Rennen)
  const wind = Math.min(1, sp / RUN);
  u.mane.forEach((m, i) => {
    m.rotation.x = m.userData.base + wind * 0.8 + Math.sin(t * 6 + i * 0.7) * (0.1 + wind * 0.15);
    m.rotation.z = m.userData.side * (0.4 + Math.sin(t * 3 + i) * 0.05);
  });
  u.tail.forEach((chain, i) => {
    chain[0].rotation.x = 0.35 + wind * 0.95 + (u.onGround ? 0 : 0.35);
    chain[0].rotation.z = chain[0].userData.spread;
    for (let k = 1; k < 3; k++) {
      chain[k].rotation.x = -0.15 - wind * 0.1 + Math.sin(t * 5 - k * 0.9 + i * 0.5) * (0.12 + wind * 0.2);
      chain[k].rotation.z = Math.sin(t * 3 + i + k) * 0.1;
    }
  });

  // --- Umschauen ---
  const L = u.look;
  const idle = sp < 0.2 && u.onGround;
  L.idle = idle ? L.idle + dt : 0;
  const pickLook = () => {
    const choices = [[-0.9, 0], [0.9, 0], [0, -0.45], [0, 0.6], [-0.6, 0.35], [0.6, -0.3], [0, 0]];
    [L.ty, L.tp] = choices[Math.floor(Math.random() * choices.length)];
    L.timer = 1.2 + Math.random() * 1.8;
  };
  if (input.look && !L.held) pickLook();
  else if (L.idle > 1.5) { L.timer -= dt; if (L.timer <= 0) pickLook(); }
  else if (!idle) { L.ty = 0; L.tp = u.onGround ? 0 : -0.2; L.timer = 0.4; }
  L.held = input.look;
  L.yaw += (L.ty - L.yaw) * Math.min(1, dt * 5);
  L.pitch += (L.tp - L.pitch) * Math.min(1, dt * 5);
  u.headPivot.rotation.set(L.pitch, L.yaw, 0);
  u.headPivot.rotation.order = "YXZ";

  // Blinzeln
  u.blink -= dt;
  if (u.blink < -0.12) u.blink = 2 + Math.random() * 3;
  u.eyes.forEach(e => e.scale.y = u.blink < 0 ? 0.1 : 1);

  // Regenbogen-Glitzer beim Rennen
  if (sp > WALK * 1.6) {
    const back = new THREE.Vector3(Math.sin(u.heading), 0, Math.cos(u.heading)).multiplyScalar(-1.3);
    spawnParticle(u.pos.clone().add(back).add(new THREE.Vector3((Math.random() - .5) * .6, 1.0 + Math.random() * .8, (Math.random() - .5) * .6)),
      RAINBOW[Math.floor(Math.random() * 7)], new THREE.Vector3(0, 0.5 + Math.random(), 0), 0.9, 1 + Math.random(), -1);
  }
  // Horn funkelt
  if (Math.random() < 0.04) {
    const hp = new THREE.Vector3(); horn.getWorldPosition(hp);
    spawnParticle(hp.add(new THREE.Vector3(0, 0.3, 0)), 0xffffff, new THREE.Vector3(0, 0.6, 0), 0.6, 0.8, 0);
  }

  // Partikel
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.vel.y -= p.gravity * dt;
    p.m.position.addScaledVector(p.vel, dt);
    p.m.rotation.y += dt * 4;
    p.m.material.opacity = Math.max(0, p.life / p.max);
    if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); particles.splice(i, 1); }
  }

  // Wolken ziehen
  clouds.forEach(c => { c.position.x += dt * 0.6; if (c.position.x > 60) c.position.x = -60; });

  // --- Third-Person-Kamera ---
  cam.target.lerp(new THREE.Vector3(u.pos.x, u.pos.y + 1.6, u.pos.z), Math.min(1, dt * 8));
  // Kamera dreht sich beim Laufen langsam hinter das Einhorn
  if (moving && !dragging && f > 0.1) {
    cam.yaw += angleDiff(cam.yaw, u.heading + Math.PI) * Math.min(1, dt * 1.2);
  }
  const cp = Math.cos(cam.pitch);
  camera.position.set(
    cam.target.x + Math.sin(cam.yaw) * cp * cam.dist,
    cam.target.y + Math.sin(cam.pitch) * cam.dist,
    cam.target.z + Math.cos(cam.yaw) * cp * cam.dist);
  if (camera.position.y < 0.4) camera.position.y = 0.4;
  camera.lookAt(cam.target);

  // Sonne/Schatten folgen dem Einhorn
  sun.position.set(u.pos.x + 10, 20, u.pos.z + 6);
  sun.target.position.copy(u.pos);
}

function dust() {
  const a = Math.random() * Math.PI * 2;
  spawnParticle(uni.pos.clone().add(new THREE.Vector3(Math.cos(a) * 0.5, 0.1, Math.sin(a) * 0.5)), 0xe9f5d0,
    new THREE.Vector3(Math.cos(a) * 2, 1 + Math.random(), Math.sin(a) * 2), 0.5, 1.5, 6);
}

// ---------------- Spielschleife ----------------
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(0.033, clock.getDelta());
  update(dt, clock.elapsedTime);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
